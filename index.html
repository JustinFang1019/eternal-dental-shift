<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#85647f">
  <meta name="description" content="依貝美學牙醫診所排班管理系統">
  <title>Eternal Shift｜依貝美學牙醫診所排班系統</title>
  <style>
    html,body{height:100%;margin:0}body{display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f2ed;color:#5d4658}.loading{text-align:center;padding:32px}.spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #d9cbd6;border-top-color:#85647f;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{display:block;margin-top:8px;color:#806f7c}
  </style>
</head>
<body>
  <div class="loading"><div class="spinner"></div><strong>正在載入 Eternal Shift…</strong><small>排班資料只儲存在目前瀏覽器</small></div>
  <script>
    (async()=>{
      try{
        if(!('DecompressionStream' in window)) throw new Error('瀏覽器不支援 DecompressionStream');
        const files=["payload/p00.txt","payload/p01.txt","payload/p02.txt","payload/p03a.txt","payload/p03b.txt","payload/p04.txt","payload/p05.txt","payload/p06.txt"];
        const parts=await Promise.all(files.map(async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${path} 載入失敗 (${r.status})`);return r.text()}));
        const encoded=parts.join('');
        if(encoded.length!==45652) throw new Error('應用程式資料長度驗證失敗');
        const b=atob(encoded),u=new Uint8Array(b.length);
        for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
        const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html))),x=>x.toString(16).padStart(2,'0')).join('');
        if(hash!=="5c6d1bf7997a771298353506a570fb89333518cbba81d2b113f6d5b7054765f7") throw new Error('應用程式完整性驗證失敗');
        document.open();document.write(html);document.close();
      }catch(error){
        document.body.innerHTML=`<main style="max-width:680px;padding:32px"><h1>無法載入排班系統</h1><p>請重新整理頁面，並使用最新版 Chrome、Edge、Safari 或 Firefox。</p><pre style="white-space:pre-wrap;background:#fff;padding:12px;border-radius:8px">${String(error)}</pre></main>`;
      }
    })();
  </script>
</body>
</html>
