name: Build and deploy Eternal Shift

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "payload/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rebuild and verify the single-file application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          chunks = [
              "payload/p00.txt",
              "payload/p01.txt",
              "payload/p02.txt",
              "payload/p03a.txt",
              "payload/p03b.txt",
              "payload/p04.txt",
              "payload/p05.txt",
              "payload/p06.txt",
          ]
          encoded = "".join(Path(path).read_text(encoding="utf-8") for path in chunks)
          if len(encoded) != 45652:
              raise SystemExit(f"Unexpected Base64 length: {len(encoded)}")

          packed = base64.b64decode(encoded, validate=True)
          if len(packed) != 34239:
              raise SystemExit(f"Unexpected gzip length: {len(packed)}")
          if hashlib.sha256(packed).hexdigest() != "62fd99c2443fc88824c0a3e0b5ff099a75f7843010eb475ff88abc27eede8bea":
              raise SystemExit("Gzip SHA-256 verification failed")

          source = gzip.decompress(packed)
          if len(source) != 99990:
              raise SystemExit(f"Unexpected source length: {len(source)}")
          if hashlib.sha256(source).hexdigest() != "5c6d1bf7997a771298353506a570fb89333518cbba81d2b113f6d5b7054765f7":
              raise SystemExit("Source SHA-256 verification failed")

          site = Path("_site")
          site.mkdir(exist_ok=True)
          (site / "index.html").write_bytes(source)
          (site / "Eternal_Shift_v1.1.1.html").write_bytes(source)
          (site / ".nojekyll").touch()
          print("Verified and built Eternal Shift v1.1.1")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
