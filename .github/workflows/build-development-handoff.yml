name: Build development handoff

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-development-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble and verify Markdown
        shell: bash
        run: |
          cat \
            handoff_payload/p00.txt \
            handoff_payload/p01.txt \
            handoff_payload/p02.txt \
            handoff_payload/p03.txt \
            handoff_payload/p04.txt \
            > DEVELOPMENT_HANDOFF.md

          test "$(wc -c < DEVELOPMENT_HANDOFF.md | tr -d ' ')" = "45483"
          echo "d8cb4dd7f77da5415bd0cb6197c8b2fd41d6d395fb92c7699e028960fc76011e  DEVELOPMENT_HANDOFF.md" | sha256sum -c -

      - name: Commit assembled document
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add complete development handoff"
          git push origin HEAD:main
